spring:
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-change-this-secret-key}
      expiration: ${JWT_EXPIRATION:1h}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
      issuer: ${JWT_ISSUER:reservas-ms-users}
      token-type: ${JWT_TOKEN_TYPE:Bearer}
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:10}
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:true}
      email: ${SECURITY_BOOTSTRAP_EMAIL:admin@reservas.local}
      password: ${SECURITY_BOOTSTRAP_PASSWORD:ChangeMe123!}
      first-name: ${SECURITY_BOOTSTRAP_FIRST_NAME:Admin}
      last-name: ${SECURITY_BOOTSTRAP_LAST_NAME:Reservas}
    public-paths:
      - /auth/login
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /webjars/**
      - /actuator/health
    rules:
      - path: /professors/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /research-lines/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /professor-research-lines/search
        methods: [POST]
        roles: [STUDENT, PROFESSOR, ADMINISTRATOR]
      - path: /professors/**
        methods: [POST, PUT, DELETE]
        roles: [PROFESSOR, ADMINISTRATOR]
      - path: /research-lines/**
        methods: [POST, PUT, DELETE]
        roles: [ADMINISTRATOR]
      - path: /professor-research-lines/**
        methods: [PUT, DELETE]
        roles: [PROFESSOR, ADMINISTRATOR]
      - path: /users/**
        methods: [GET, POST, PUT, DELETE]
        roles: [ADMINISTRATOR]
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:ms-users}
    default-ttl: ${CACHE_DEFAULT_TTL:15m}
    domains:
      users:
        ttl: ${CACHE_TTL_USERS:30m}
        persistent: false
      professors:
        ttl: ${CACHE_TTL_PROFESSORS:30m}
        persistent: false
      researchLines:
        ttl: ${CACHE_TTL_RESEARCH_LINES:1h}
        persistent: false
      researchLineCatalog:
        persistent: true
      professorResearchLines:
        ttl: ${CACHE_TTL_PROFESSOR_LINES:30m}
        persistent: false
      userRoles:
        ttl: ${CACHE_TTL_USER_ROLES:15m}
        persistent: false
